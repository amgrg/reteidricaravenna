name: Aggiorna guasti e rete OSM

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Guasti dalle notizie
        run: python scripts/aggiorna_guasti.py --giorni 30
      - name: Snapshot rete OpenStreetMap
        run: python scripts/scarica_rete_osm.py || echo "Overpass non disponibile, snapshot invariato"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Aggiornamento automatico dati $(date -u +%F)"
          git push
